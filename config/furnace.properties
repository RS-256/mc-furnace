# mc-furnace pipeline configuration.
# Paths are resolved against the current working directory.

# Target repository that receives the generated commits.
terra.repo=../mc-terra

# Verified downloads (jars, mappings, libraries) are kept here across runs.
cache.dir=cache

# Per-version intermediate outputs; deleted after a successful commit.
work.dir=work

# piston-meta endpoint.
manifest.url=https://piston-meta.mojang.com/mc/game/version_manifest_v2.json

# Heap for the external Vineflower process.
decompiler.heap=4g

# Run the data generator to produce reports.
# Set false to skip (e.g. when a matching JRE is unavailable).
reports.enabled=true

# Oldest version in scope (SPEC: 1.14.4 and later only).
scope.from=1.14.4
