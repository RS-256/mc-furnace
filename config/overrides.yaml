# Manual ordering corrections.
# piston-meta releaseTime is authoritative; entries here override the value
# used for SORTING ONLY (the recorded releaseTime stays as published).
#
# Old-line hotfix releases published while the next line's snapshots were
# already running are sorted back next to their own line; otherwise the
# snapshots history degrades into revert/redo churn at each boundary.
#
# should same time-code as auto-generated; "YYYY-MM-DD:HH:mm:ss+TimeZone"
releaseTimeOverrides:
  # 1.16.5 hotfixes, published between 20w51a and 21w03a (1.17 snapshots).
  # Sorted to sit right after 1.16.4, before 20w45a.
  # 1.16.4:     "2020-10-29T15:49:37+00:00"
  "1.16.5-rc1": "2020-10-30T00:00:00+00:00"
  "1.16.5":     "2020-10-30T01:00:00+00:00"
  # 20w45a:     "2020-11-04T16:42:00+00:00"

  # 26.1.2 hotfixes, published between 26.2-snapshot-1 and 26.2-snapshot-2.
  # Sorted to sit right after 26.1.1, before 26.2-snapshot-1.
  # 26.1.1:          "2026-04-01T09:06:36+00:00"
  "26.1.2-rc-1":     "2026-04-02T00:00:00+00:00"
  "26.1.2":          "2026-04-02T01:00:00+00:00"
  # 26.2-snapshot-1: "2026-04-07T11:52:43+00:00"

# Versions whose data generator (--reports) crashes for an upstream reason.
# Only a crash of the data generator itself is tolerated: the version is then
# committed without reports/ (reports/datagen_failed.txt records the failure).
# Any other failure, or a datagen crash on an unlisted version, stops the run.
skipReportsOnDatagenFailure:
  # 23w07a: vanilla bug, fixed in 1.19.4-pre1.
  # The first report provider, BiomeParametersDumpReport, encodes the overworld
  # preset. That preset references minecraft:cherry_grove, but the lookup it
  # receives is the vanilla registry one, where cherry_grove does not exist
  # (only UpdateOneTwentyRegistries has it):
  #   IllegalStateException: Missing element
  #     ResourceKey[minecraft:worldgen/biome / minecraft:cherry_grove]
  # Only biome_parameters/minecraft/nether.json is written; the remaining
  # providers (overworld.json, blocks, commands, registries) never run.
  - "23w07a"
