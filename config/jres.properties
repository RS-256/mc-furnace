# Java runtimes for the data generator step.
# Maps a required Java major version to a java executable. When a required
# major has no entry and the current JVM is older than required, the version
# fails with an instructive error. When the current JVM is same or newer it is
# used as a fallback.
#
# 8  = C:/jres/jdk8/bin/java.exe
# 16 = C:/jres/jdk16/bin/java.exe
# 17 = C:/jres/jdk17/bin/java.exe
# 21 = C:/jres/jdk21/bin/java.exe
# 25 = C:/jres/jdk25/bin/java.exe