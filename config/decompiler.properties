# Vineflower options, all explicit for deterministic output.
# Passed to the external Vineflower process as -key=value arguments.
# Values are trimmed; quote a value to preserve surrounding whitespace.

# decompile generic signatures
dgs=1
# encode non-ASCII characters as unicode escapes (stable ASCII-only output)
asc=1
# force \n line endings regardless of platform
nls=1
# decompile inner classes
din=1
# hide bridge methods
rbr=1
# keep synthetic class members hidden
rsy=0
# decompile enums as enums
den=1
# use LVT names when present (absent in obfuscated jars; keeps output stable)
udv=1
# do not include the entire runtime classpath implicitly; libraries are passed via -e
iec=0
# indent with 4 spaces (Java convention); the decompiler default is 3.
# wrapped lines indent in multiples of this string, so continuation becomes 8.
ind="    "
